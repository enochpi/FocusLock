name: berry_focused
description: A focus app with life progression
publish_to: 'none'
version: 1.0.0+7f

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  rive: ^0.13.1

  # App monitoring
  app_usage: ^4.0.1

  # Storage
  shared_preferences: ^2.5.3

  app_settings: ^5.1.1

  cupertino_icons: ^1.0.2

  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  audioplayers: ^6.0.0

  share_plus: ^10.0.0
  path_provider: ^2.1.5
  flutter_foreground_task: ^8.13.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.5.4
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.1


flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"


flutter:
  uses-material-design: true
  assets:
    - assets/animations/bob_idle.riv
    - assets/images/cave_background.webp
    - assets/images/house.webp
    - assets/images/shack.webp
    - assets/images/cave.webp
    - assets/images/shack_background.webp
    - assets/images/house_background.webp
    - assets/images/house_bedroom_background.webp
    - assets/images/stone_fire.webp
    - assets/images/stone_bed.webp
    - assets/images/stone_rug.webp
    - assets/images/stone_table.webp
    - assets/images/stone_chair.webp
    - assets/images/shack_bed.webp
    - assets/images/shack_stove.webp
    - assets/images/shack_table.webp
    - assets/images/shack_picture.webp
    - assets/images/house_table.webp
    - assets/images/house_stove.webp
    - assets/images/house_cabinet.webp
    - assets/images/house_light.webp
    - assets/images/house_fridge.webp
    - assets/images/house_bunkbed.webp
    - assets/images/house_bed.webp
    - assets/images/house_desk.webp
    - assets/images/house_clock.webp
    - assets/images/house_picture.webp
    - assets/sounds/achievement.wav
    - assets/sounds/background_music.mp3
